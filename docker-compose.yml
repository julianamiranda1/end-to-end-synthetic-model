services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santo-garfo-api
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: santo-garfo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf-cache:
